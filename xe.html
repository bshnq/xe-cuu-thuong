<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xe cứu thương — Tài xế</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <!-- Trạng thái hiện tại -->
  <div class="card">
    <div class="status-line">
      <span class="dot" id="dot"></span>
      <div style="flex:1">
        <div style="font-size:24px;font-weight:800" id="vehName">—</div>
        <div class="veh-plate" id="vehPlate"></div>
      </div>
      <span class="badge" id="badge">—</span>
    </div>
  </div>

  <!-- KHI XE RẢNH: chọn điểm đến + thời gian đi -->
  <div class="card" id="panelAvail" style="display:none">
    <h2>Điểm đến (tùy chọn)</h2>
    <div class="dchips" id="destChips"></div>
    <input class="text" id="dest" placeholder="Nhập điểm đến khác…">

    <h2 style="margin-top:20px">Thời gian đi dự kiến</h2>
    <div class="chips" id="presetChips"></div>

    <div class="field-lbl">Khác</div>
    <div class="stepper">
      <button type="button" onclick="stepCustom(-5)">−</button>
      <input id="customMin" type="number" inputmode="numeric" value="90" min="5" step="5">
      <button type="button" onclick="stepCustom(5)">+</button>
      <button type="button" class="go" onclick="startCustom()">Đi</button>
    </div>
  </div>

  <!-- KHI XE ĐANG ĐI: đếm ngược + Về -->
  <div class="card" id="panelBusy" style="display:none">
    <div class="count-block" id="countBlock">
      <div class="count-num" id="countNum">--:--</div>
      <div class="count-cap" id="countCap">còn lại đến dự kiến về</div>
    </div>
    <div class="sub" id="tripInfo"></div>

    <button class="btn home" style="margin-top:16px" onclick="goHome()">ĐÃ VỀ</button>
  </div>

  <div class="foot" id="foot"></div>
</div>

<!-- Firebase SDK (bỏ qua vô hại khi chạy demo) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
var CFG=window.APP_CONFIG;
document.getElementById("foot").textContent=CFG.unit;

/* ----- xác định xe từ ?id= ----- */
var params=new URLSearchParams(location.search);
var vehId=params.get("id")||CFG.vehicles[0].id;
var vehCfg=CFG.vehicles.filter(function(v){return v.id===vehId;})[0];
if(!vehCfg){
  document.body.innerHTML='<div class="wrap"><div class="card"><h2>Không tìm thấy xe</h2>'
    +'<p>Mã QR chưa đúng: <code>?id='+vehId+'</code></p></div></div>';
  throw new Error("unknown vehicle");
}
document.title=vehCfg.label;
document.getElementById("vehName").textContent=vehCfg.label;
document.getElementById("vehPlate").textContent=vehCfg.plate||"";

/* ----- ô "Khác" mặc định ----- */
document.getElementById("customMin").value = CFG.customDefault || 90;

/* ----- gợi ý điểm đến ----- */
var destEl=document.getElementById("dest");
var dchipsEl=document.getElementById("destChips");
(CFG.destinations||[]).forEach(function(name){
  var b=document.createElement("button");
  b.className="dchip"; b.textContent=name;
  b.onclick=function(){
    destEl.value = (destEl.value.trim()===name) ? "" : name;
    syncDestChips();
  };
  dchipsEl.appendChild(b);
});
destEl.addEventListener("input", syncDestChips);
function syncDestChips(){
  var v=destEl.value.trim();
  Array.prototype.forEach.call(dchipsEl.children,function(b){
    b.classList.toggle("on", b.textContent===v);
  });
}

/* ----- dựng chip mốc thời gian (bấm là ĐI ngay) ----- */
var chipsEl=document.getElementById("presetChips");
CFG.presets.forEach(function(m){
  var b=document.createElement("button");
  b.className="chip"; b.innerHTML=m+' <small>phút</small>';
  b.onclick=function(){ start(m); };
  chipsEl.appendChild(b);
});

/* ----- hành động ----- */
function stepCustom(d){
  var el=document.getElementById("customMin");
  var v=(parseInt(el.value,10)||0)+d; if(v<5)v=5; el.value=v;
}
function start(min){ Store.startTrip(vehId,min,destEl.value.trim()); }
function startCustom(){
  var v=parseInt(document.getElementById("customMin").value,10);
  if(!v||v<5){alert("Nhập số phút hợp lệ (≥5).");return;}
  start(v);
}
function goHome(){ Store.endTrip(vehId); }

/* ----- render theo trạng thái ----- */
var current=null;
function pad(n){return (n<10?"0":"")+n;}
Store.subscribeAll(function(map){ current=map[vehId]; render(); });

function render(){
  if(!current) return;
  var busy=current.status==="busy";
  document.getElementById("panelAvail").style.display=busy?"none":"block";
  document.getElementById("panelBusy").style.display=busy?"block":"none";

  var dot=document.getElementById("dot"), badge=document.getElementById("badge");
  if(!busy){
    dot.className="dot available"; badge.className="badge available"; badge.textContent="Sẵn sàng";
  }else{
    var late=Date.now()>current.returnAt;
    dot.className="dot "+(late?"late":"busy");
    badge.className="badge "+(late?"late":"busy");
    badge.textContent=late?"Quá giờ":"Đang đi";
    var d=new Date(current.departAt);
    document.getElementById("tripInfo").innerHTML=
      "Xuất phát "+pad(d.getHours())+":"+pad(d.getMinutes())
      +" · dự kiến đi "+current.etaMinutes+" phút"
      +(current.destination?(" · "+current.destination):"");
  }
}

/* ----- đồng hồ đếm ngược mỗi giây ----- */
setInterval(function(){
  if(!current||current.status!=="busy") return;
  var diff=current.returnAt-Date.now();
  var late=diff<0; var s=Math.floor(Math.abs(diff)/1000);
  var mm=Math.floor(s/60), ss=s%60;
  document.getElementById("countNum").textContent=(late?"+":"")+pad(mm)+":"+pad(ss);
  document.getElementById("countCap").textContent=late?"đã quá giờ dự kiến về":"còn lại đến dự kiến về";
  document.getElementById("countBlock").className="count-block"+(late?" late":"");
},1000);
</script>
</body>
</html>
