<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công xa dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dash">
<div class="wrap">

  <div class="appbar">
    <h1>CÔNG XA DASHBOARD</h1>
  </div>

  <div style="text-align:right;margin:0 4px 12px">
    <span class="clock" id="clock">—</span>
  </div>

  <div class="fleet" id="fleet"></div>

  <div class="foot" id="foot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
var CFG=window.APP_CONFIG;
document.getElementById("foot").textContent=CFG.unit;

function pad(n){return (n<10?"0":"")+n;}

/* dựng khung mỗi xe 1 lần */
var fleet=document.getElementById("fleet");
var cards={};
CFG.vehicles.forEach(function(v){
  var el=document.createElement("div");
  el.className="veh"; el.id="card_"+v.id;
  el.innerHTML=
    '<div class="veh-head"><div class="veh-name">'+v.label+'</div>'
    +'<div class="veh-plate">'+(v.plate||"")+'</div>'
    +'<span class="badge" data-role="badge">—</span></div>'
    +'<div data-role="body"></div>';
  fleet.appendChild(el);
  cards[v.id]=el;
});

var state={};
Store.subscribeAll(function(map){ state=map; render(); });

function render(){
  CFG.vehicles.forEach(function(v){
    var s=state[v.id]||{status:"available"};
    var el=cards[v.id];
    var badge=el.querySelector('[data-role=badge]');
    var body=el.querySelector('[data-role=body]');
    if(s.status!=="busy"){
      el.className="veh available";
      badge.textContent="Sẵn sàng";
      body.innerHTML='<div class="avail-msg">SẴN SÀNG</div>';
    }else{
      el.className="veh busy";
      badge.textContent="Đang đi";
      var d=new Date(s.departAt);
      body.innerHTML=
        '<div class="veh-big"><div class="lbl">Dự kiến về sau</div>'
        +'<div class="val" data-role="count" data-return="'+s.returnAt+'">--:--</div></div>'
        +'<div class="veh-eta">Xuất phát '+pad(d.getHours())+':'+pad(d.getMinutes())
        +' · đi '+s.etaMinutes+' phút'
        +(s.destination?(' · '+s.destination):'')+'</div>';
    }
  });
  tick();
}

/* cập nhật đồng hồ + đếm ngược mỗi giây */
function tick(){
  var now=new Date();
  document.getElementById("clock").textContent=
    pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  var counts=document.querySelectorAll('[data-role=count]');
  counts.forEach(function(c){
    var ret=parseInt(c.getAttribute("data-return"),10);
    var diff=ret-Date.now(); var late=diff<0;
    var s=Math.floor(Math.abs(diff)/1000);
    c.textContent=(late?"+":"")+pad(Math.floor(s/60))+":"+pad(s%60);
    var card=c.closest(".veh");
    if(card){
      var lbl=card.querySelector('.veh-big .lbl');
      if(lbl) lbl.textContent=late?"Đã quá giờ":"Dự kiến về sau";
    }
  });
}
setInterval(tick,1000);
</script>
</body>
</html>
