<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công xa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Roboto+Condensed:wght@700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body class="dash">
<div class="wrap">

  <div class="appbar">
    <h1>Công xa</h1>
    <span class="clock" id="clock">-</span>
    <a class="navlink" href="log.html" id="navLog" hidden>Nhật ký</a>
    <button class="navlink" id="btnOut" hidden>Thoát</button>
  </div>

  <div class="card gate" id="gate" hidden></div>
  <div class="fleet" id="fleet" hidden></div>

  <div class="foot" id="foot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>window.APP_AUTH="google";</script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
var CFG=window.APP_CONFIG, esc=UI.esc;
document.getElementById("foot").textContent=CFG.unit;

/* ----- đăng nhập: chỉ tài khoản Google được duyệt mới xem được ----- */
var gateEl=document.getElementById("gate"), fleetEl=document.getElementById("fleet");
var btnOut=document.getElementById("btnOut"), navLog=document.getElementById("navLog");
btnOut.onclick=function(){ Store.signOut(); };
function showGate(html){ gateEl.innerHTML=html; gateEl.hidden=false; fleetEl.hidden=true; navLog.hidden=true; }
var seenUid;
Store.onUser(function(u){
  var uid=u?u.uid:null;
  if(seenUid && uid && uid!==seenUid){ location.reload(); return; }   // đổi tài khoản: tải lại để đọc theo quyền mới
  if(uid) seenUid=uid;
  btnOut.hidden=!u;
  if(!u){
    showGate('<h2>Công xa</h2><p>Đăng nhập để xem tình trạng xe</p><button class="btn" id="btnLogin">Đăng nhập Google</button>');
    document.getElementById("btnLogin").onclick=function(){ Store.signInGoogle(); };
    return;
  }
  Store.checkAccess().then(function(ok){
    if(!ok){
      showGate('<h2>Chưa có quyền xem</h2><p>'+esc(u.email||"")+'</p><p>Nhờ khoa Cấp cứu thêm email này vào danh sách được xem.</p>');
      return;
    }
    gateEl.hidden=true; fleetEl.hidden=false; navLog.hidden=false;
  });
});

var REFRESH='<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>';
var fleet=document.getElementById("fleet"), cards={};
function buildFleet(){
  fleet.innerHTML=""; cards={};
  CFG.vehicles.forEach(function(v){
    var el=document.createElement("div");
    el.className="veh available";
    el.innerHTML=
       '<div class="veh-head"><div><div class="veh-name">'+esc(v.label)+'</div>'+UI.plateHTML(v.plate)+'</div>'
      +'<span class="pill" data-r="pill">-</span></div>'
      +'<div class="veh-main" data-r="main"></div>'
      +'<div class="veh-gps" data-r="gps" hidden><a class="gps-link" target="_blank" rel="noopener"></a>'
      +'<button class="gps-refresh" type="button" title="Cập nhật vị trí ngay" aria-label="Cập nhật vị trí">'+REFRESH+'</button></div>'
      +'<div class="veh-foot" data-r="foot"></div>';
    fleet.appendChild(el);
    cards[v.id]=el;
  });
}
var state={}, gps={};
Store.onSettings(function(){ buildFleet(); render(); });
Store.subscribeAll(function(map){ state=map; render(); });

/* ----- GPS từ quanlyxe.vn ----- */
var PIN='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
function distM(a,b,c,d){
  var R=6371000, r=Math.PI/180, x=(d-b)*r*Math.cos((a+c)/2*r), y=(c-a)*r;
  return Math.sqrt(x*x+y*y)*R;
}
function shortAddr(s){
  var p=String(s||"").split(",").map(function(x){return x.trim();})
    .filter(function(x){return x && !/^(TP\.?|Thành phố)\s*Hồ Chí Minh$/i.test(x);});
  return p.slice(0,2).join(", ");
}
function ago(ms){
  var m=Math.floor(ms/60000);
  if(m<1) return "vừa xong";
  if(m<60) return m+" phút";
  var h=Math.floor(m/60); return h<24? h+" giờ" : Math.floor(h/24)+" ngày";
}
function renderGps(){
  var H=CFG.hospital, now=Date.now();
  var devMs=(CFG.gpsStaleMinutes||30)*60000, syncMs=(CFG.gpsSyncStaleMinutes||25)*60000;
  CFG.vehicles.forEach(function(v){
    var el=cards[v.id]; if(!el) return;
    var row=q(el,"gps"), a=row.querySelector(".gps-link"), g=gps[v.id];
    if(!g||!g.lat||!g.lng){ row.hidden=true; return; }
    var gt=g.gpsTime||g.fetchedAt||0, age=now-gt;
    // mất tín hiệu = thiết bị trên xe lâu không gửi, hoặc Apps Script lâu không cập nhật
    var stale=((g.fetchedAt||now)-gt)>devMs || (now-(g.fetchedAt||0))>syncMs;
    var home=H && distM(H.lat,H.lng,g.lat,g.lng)<=(H.radius||150) && (g.speed||0)<5;
    var place=home?"Tại BV":(shortAddr(g.address)||(g.lat.toFixed(5)+", "+g.lng.toFixed(5)));
    var meta=stale?"mất tín hiệu "+ago(age)
      :((g.speed||0)>=5?g.speed+" km/h"+(age>=60000?" · "+ago(age):""):ago(age));
    a.href="https://www.google.com/maps?q="+g.lat+","+g.lng;
    a.title=(g.address||"")+(g.gpsTime?" · GPS "+UI.hm(g.gpsTime):"");
    row.className="veh-gps"+(stale?" stale":"")+(home?" home":"")+(refreshing?" spin":"");
    a.innerHTML=PIN+'<span class="gps-place">'+esc(place)+'</span><span class="gps-meta">'+esc(meta)+'</span>';
    row.hidden=false;
  });
}
setInterval(renderGps,15000);

/* Nút ↻: cập nhật vị trí cả đội xe ngay */
var refreshing=false;
fleet.addEventListener("click",function(ev){
  var b=ev.target.closest&&ev.target.closest(".gps-refresh"); if(!b||refreshing) return;
  refreshing=true; renderGps();
  var before=JSON.stringify(gps), t0=Date.now();
  function done(msg){ refreshing=false; renderGps(); if(msg) UI.toast(msg); }
  Store.refreshGps().then(function(j){
    if(j && j.skipped){ done("Vị trí "+j.skipped); return; }
    // chờ Firebase đẩy dữ liệu mới về (tối đa 8 giây)
    (function wait(){ if(JSON.stringify(gps)!==before || Date.now()-t0>8000) done(); else setTimeout(wait,300); })();
  }).catch(function(e){
    done(/denied/.test(e&&e.message)?"Tài khoản này không có quyền cập nhật":"Chưa cập nhật được, thử lại sau");
  });
});
Store.subscribeGps(function(map){ gps=map; renderGps(); });

function q(el,r){ return el.querySelector('[data-r='+r+']'); }
function render(){
  CFG.vehicles.forEach(function(v){
    var s=state[v.id]||{status:"available"}, el=cards[v.id]; if(!el) return;
    if(s.status!=="busy"){
      q(el,"main").innerHTML='<div class="veh-ready">Sẵn sàng</div>';
    }else{
      q(el,"main").innerHTML='<div class="veh-big" data-return="'+s.returnAt+'">--:--</div>'
        +'<div class="veh-sub">'+UI.hm(s.departAt)+'  →  '+UI.hm(s.returnAt)+'</div>';
    }
    q(el,"foot").innerHTML=s.driver
      ?'<span class="veh-driver">'+esc(s.driver)+'</span>'+UI.phoneHTML(s.driver)
      :'<span class="veh-driver none">Chưa có tài xế</span>';
    el._s=s;
  });
  renderGps();
  tick();
}

function tick(){
  var now=new Date();
  document.getElementById("clock").textContent=UI.hm(now)+":"+UI.pad(now.getSeconds());
  CFG.vehicles.forEach(function(v){
    var el=cards[v.id]; if(!el) return;
    var s=el._s||{status:"available"}, pill=q(el,"pill");
    if(s.status!=="busy"){ el.className="veh available"; pill.style.visibility="hidden"; return; }
    pill.style.visibility="visible";
    var diff=s.returnAt-Date.now(), late=diff<0;
    el.className="veh "+(late?"late":"busy");
    pill.textContent=s.destination||"Đang đi";
    var big=el.querySelector(".veh-big"); if(big) big.textContent=UI.countdown(diff);
  });
}
setInterval(tick,1000);
</script>
</body>
</html>
