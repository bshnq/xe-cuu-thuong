<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công xa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Roboto+Condensed:wght@700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body class="dash">
<div class="wrap">

  <div class="appbar">
    <h1>Công xa</h1>
    <span class="clock" id="clock">-</span>
    <a class="navlink" href="log.html">Nhật ký</a>
  </div>

  <div class="fleet" id="fleet"></div>

  <div class="foot" id="foot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
var CFG=window.APP_CONFIG, esc=UI.esc;
document.getElementById("foot").textContent=CFG.unit;

var fleet=document.getElementById("fleet"), cards={};
function buildFleet(){
  fleet.innerHTML=""; cards={};
  CFG.vehicles.forEach(function(v){
    var el=document.createElement("div");
    el.className="veh available";
    el.innerHTML=
       '<div class="veh-head"><div><div class="veh-name">'+esc(v.label)+'</div>'+UI.plateHTML(v.plate)+'</div>'
      +'<span class="pill" data-r="pill">-</span></div>'
      +'<div class="veh-main" data-r="main"></div>'
      +'<a class="veh-gps" data-r="gps" target="_blank" rel="noopener" hidden></a>'
      +'<div class="veh-foot" data-r="foot"></div>';
    fleet.appendChild(el);
    cards[v.id]=el;
  });
}
var state={}, gps={};
Store.onSettings(function(){ buildFleet(); render(); });
Store.subscribeAll(function(map){ state=map; render(); });

/* ----- GPS từ quanlyxe.vn ----- */
var PIN='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
function distM(a,b,c,d){
  var R=6371000, r=Math.PI/180, x=(d-b)*r*Math.cos((a+c)/2*r), y=(c-a)*r;
  return Math.sqrt(x*x+y*y)*R;
}
function shortAddr(s){
  var p=String(s||"").split(",").map(function(x){return x.trim();})
    .filter(function(x){return x && !/^(TP\.?|Thành phố)\s*Hồ Chí Minh$/i.test(x);});
  return p.slice(0,2).join(", ");
}
function ago(ms){
  var m=Math.floor(ms/60000);
  if(m<1) return "vừa xong";
  if(m<60) return m+" phút";
  var h=Math.floor(m/60); return h<24? h+" giờ" : Math.floor(h/24)+" ngày";
}
function renderGps(){
  var H=CFG.hospital, staleMs=(CFG.gpsStaleMinutes||5)*60000, now=Date.now();
  CFG.vehicles.forEach(function(v){
    var el=cards[v.id]; if(!el) return;
    var a=q(el,"gps"), g=gps[v.id];
    if(!g||!g.lat||!g.lng){ a.hidden=true; return; }
    var age=now-(g.gpsTime||g.fetchedAt||0), stale=age>staleMs;
    var home=H && distM(H.lat,H.lng,g.lat,g.lng)<=(H.radius||150) && (g.speed||0)<5;
    var place=home?"Tại BV":(shortAddr(g.address)||(g.lat.toFixed(5)+", "+g.lng.toFixed(5)));
    var meta=stale?"mất tín hiệu "+ago(age):((g.speed||0)>=5?g.speed+" km/h":ago(age));
    a.href="https://www.google.com/maps?q="+g.lat+","+g.lng;
    a.title=(g.address||"")+(g.gpsTime?" · GPS "+UI.hm(g.gpsTime):"");
    a.className="veh-gps"+(stale?" stale":"")+(home?" home":"");
    a.innerHTML=PIN+'<span class="gps-place">'+esc(place)+'</span><span class="gps-meta">'+esc(meta)+'</span>';
    a.hidden=false;
  });
}
setInterval(renderGps,15000);
Store.subscribeGps(function(map){ gps=map; renderGps(); });

function q(el,r){ return el.querySelector('[data-r='+r+']'); }
function render(){
  CFG.vehicles.forEach(function(v){
    var s=state[v.id]||{status:"available"}, el=cards[v.id]; if(!el) return;
    if(s.status!=="busy"){
      q(el,"main").innerHTML='<div class="veh-ready">Sẵn sàng</div>';
    }else{
      q(el,"main").innerHTML='<div class="veh-big" data-return="'+s.returnAt+'">--:--</div>'
        +'<div class="veh-sub">'+UI.hm(s.departAt)+'  →  '+UI.hm(s.returnAt)+'</div>';
    }
    q(el,"foot").innerHTML=s.driver
      ?'<span class="veh-driver">'+esc(s.driver)+'</span>'+UI.phoneHTML(s.driver)
      :'<span class="veh-driver none">Chưa có tài xế</span>';
    el._s=s;
  });
  renderGps();
  tick();
}

function tick(){
  var now=new Date();
  document.getElementById("clock").textContent=UI.hm(now)+":"+UI.pad(now.getSeconds());
  CFG.vehicles.forEach(function(v){
    var el=cards[v.id]; if(!el) return;
    var s=el._s||{status:"available"}, pill=q(el,"pill");
    if(s.status!=="busy"){ el.className="veh available"; pill.style.visibility="hidden"; return; }
    pill.style.visibility="visible";
    var diff=s.returnAt-Date.now(), late=diff<0;
    el.className="veh "+(late?"late":"busy");
    pill.textContent=s.destination||"Đang đi";
    var big=el.querySelector(".veh-big"); if(big) big.textContent=UI.countdown(diff);
  });
}
setInterval(tick,1000);
</script>
</body>
</html>
